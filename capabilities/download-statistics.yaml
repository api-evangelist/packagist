name: Download Statistics
description: |
  Surface per-package and per-version download statistics from Packagist. Useful
  for measuring adoption, sequencing deprecations, and benchmarking PHP ecosystem
  trends.
api: packagist-api
governance:
  classification: read-only
  authentication: none
operations:
- operationId: getPackageStats
  intent: Get total, monthly, daily, and per-version installs for a single package.
- operationId: getStatistics
  intent: Get registry-wide totals across all packages.
inputs:
- name: vendor
  required: true
  description: Vendor portion of the package name.
- name: package
  required: true
  description: Package portion of the package name.
outputs:
- name: downloads
  description: Aggregate installs (total/monthly/daily).
- name: versions
  description: Per-version install counts.
